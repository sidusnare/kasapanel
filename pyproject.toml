[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kasapanel"
version = "1.6.2"
description = "Threaded HTTPS dashboard, control and scheduler daemon for python-kasa devices"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Kasa Panel contributors"}]
keywords = ["kasa", "tplink", "smarthome", "daemon", "scheduler", "pam"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: No Input/Output (Daemon)",
  "Framework :: AsyncIO",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "python-kasa>=0.7",
  "python-pam>=2.0",
  "cryptography>=41",
  # python-pam 2.0.2 imports six but declares no dependencies, so it is
  # named here or the import fails at runtime.
  "six>=1.16",
]

[project.optional-dependencies]
dev = ["pylint>=3.0"]

[project.urls]
Homepage = "https://example.invalid/kasapanel"
Source = "https://example.invalid/kasapanel"

[project.scripts]
kasapanel = "kasapanel.cli:main"

[tool.setuptools]
packages = ["kasapanel"]

[tool.setuptools.package-data]
kasapanel = ["static/*"]
