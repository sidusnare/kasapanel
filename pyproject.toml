[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kasapanel"
dynamic = ["version"]
description = "Threaded HTTPS dashboard, control and scheduler daemon for python-kasa devices"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Kasa Panel contributors"}]
keywords = ["kasa", "tplink", "smarthome", "daemon", "scheduler", "pam"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: No Input/Output (Daemon)",
  "Framework :: AsyncIO",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "python-kasa>=0.7",
  "python-pam>=2.0",
  "cryptography>=41",
  # python-pam 2.0.2 imports six but declares no dependencies, so it is
  # named here or the import fails at runtime.
  "six>=1.16",
]

[project.optional-dependencies]
dev = [
  "pylint>=3.0",
  "ruff>=0.17",
  "reuse>=5.0",
  "yamllint>=1.37",
]

[project.urls]
Homepage = "https://example.invalid/kasapanel"
Source = "https://example.invalid/kasapanel"

[project.scripts]
kasapanel = "kasapanel.cli:main"

[tool.setuptools]
packages = ["kasapanel"]

# The version lives in kasapanel/__init__.py and is read from there,
# so it is defined in exactly one place.
[tool.setuptools.dynamic]
version = {attr = "kasapanel.__version__"}

[tool.setuptools.package-data]
kasapanel = ["static/*"]

# Ruff is configured to match the Google Python Style Guide and this
# project's established conventions rather than ruff's own defaults:
# 80 columns and single quotes, not 88 and double.  Where a ruff default
# disagrees with the style guide, the style guide wins.
[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py310"
extend-exclude = ["frontend/node_modules"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear,
# flake8-simplify and ruff's own checks.  Blind-except (BLE) is left to
# pylint, which this project already scores 10.00 against: a daemon
# thread that must not die has a legitimate use for a broad except.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# Google style: standard library, third party, then first party, with a
# single blank line between groups.
known-first-party = ["kasapanel"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# SIM117 (combine nested `with` statements) is off for the test suite
# only, and stays enforced in the package.  The suite deliberately nests
# `with mock.patch(...)` around `with self.assertRaises(...)` so that
# arrangement reads separately from assertion; where several patches are
# all arrangement it already combines them into one statement.  Merging
# the two kinds would hide that distinction.
"tests/*" = ["SIM117"]
